name: Build JARVIS APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Setup Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Setup Android SDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # 4. Install required Android SDK packages
      - name: Install Android SDK Packages
        shell: bash
        run: |
          set -e

          echo "Android SDK: $ANDROID_HOME"

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -f "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
              -type f \
              -name sdkmanager \
              | head -n 1)
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found."
            exit 1
          fi

          echo "Using sdkmanager: $SDKMANAGER"

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # 5. Setup Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 6. Extract JARVIS project if ZIP exists
      - name: Extract JARVIS Android Project
        shell: bash
        run: |
          set -e

          if [ -f "Jarvis-Android-Project.zip" ]; then
            echo "JARVIS ZIP found."

            rm -rf jarvis_project
            mkdir -p jarvis_project

            unzip -q "Jarvis-Android-Project.zip" \
              -d jarvis_project

            echo "JARVIS project extracted."
          else
            echo "No JARVIS ZIP found."
            echo "Using repository files directly."
          fi

      # 7. Find Android project
      - name: Find Android Project
        shell: bash
        run: |
          set -e

          echo "Searching for Android project..."

          PROJECT_DIR=""

          # Check repository root
          if [ -f "settings.gradle" ] || \
             [ -f "settings.gradle.kts" ]; then

            PROJECT_DIR="."

          else

            # Search extracted project and repository
            PROJECT_DIR=$(find . \
              -path "./.git" -prune -o \
              -type f \
              \( \
                -name "settings.gradle" \
                -o \
                -name "settings.gradle.kts" \
              \) \
              -print \
              -quit \
              | xargs -r dirname)

          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project not found."
            echo ""
            echo "Files found in repository:"
            find . -maxdepth 4 -type f | head -200
            exit 1
          fi

          PROJECT_DIR=$(cd "$PROJECT_DIR" && pwd)

          echo "Android project found:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # 8. Show project structure
      - name: Verify Android Project
        shell: bash
        run: |
          set -e

          echo "Project directory:"
          echo "$PROJECT_DIR"

          echo ""
          echo "Project files:"
          find "$PROJECT_DIR" -maxdepth 3 -type f \
            | sort \
            | head -200

      # 9. Make Gradle wrapper executable
      - name: Prepare Gradle Wrapper
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            echo "Gradle wrapper found."
          else
            echo "ERROR: gradlew not found."
            echo ""
            echo "The Android project must contain gradlew."
            exit 1
          fi

      # 10. Build Debug APK
      - name: Build JARVIS Debug APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Building JARVIS APK..."

          ./gradlew \
            --no-daemon \
            --stacktrace \
            assembleDebug

      # 11. Find generated APK
      - name: Find APK
        shell: bash
        run: |
          set -e

          echo "Searching for generated APK..."

          find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -print

      # 12. Upload APK
      - name: Upload JARVIS APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-APK
          path: |
            ${{ env.PROJECT_DIR }}/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 7
