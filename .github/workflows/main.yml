package com.example.calculator;

import android.os.Bundle;
import android.view.View;
import android.widget.Button;
import android.widget.EditText;
import android.widget.TextView;

import androidx.appcompat.app.AppCompatActivity;

public class MainActivity extends AppCompatActivity {

    EditText number1, number2;
    TextView result;

    @Override
    protected void onCreate(Bundle savedInstanceState) {
        super.onCreate(savedInstanceState);
        setContentView(R.layout.activity_main);

        number1 = findViewById(R.id.number1);
        number2 = findViewById(R.id.number2);
        result = findViewById(R.id.result);

        findViewById(R.id.add).setOnClickListener(v -> calculate("+"));
        findViewById(R.id.subtract).setOnClickListener(v -> calculate("-"));
        findViewById(R.id.multiply).setOnClickListener(v -> calculate("*"));
        findViewById(R.id.divide).setOnClickListener(v -> calculate("/"));
    }

    private void calculate(String operation) {
        try {
            double a = Double.parseDouble(number1.getText().toString());
            double b = Double.parseDouble(number2.getText().toString());
            double answer;

            switch (operation) {
                case "+":
                    answer = a + b;
                    break;
                case "-":
                    answer = a - b;
                    break;
                case "*":
                    answer = a * b;
                    break;
                case "/":
                    if (b == 0) {
                        result.setText("0 দিয়ে ভাগ করা যাবে না");
                        return;
                    }
                    answer = a / b;
                    break;
                default:
                    return;
            }

            result.setText("ফলাফল: " + answer);

        } catch (Exception e) {
            result.setText("দুটি সংখ্যা লিখুন");
        }
    }
}
