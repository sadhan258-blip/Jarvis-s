import android.os.Bundle;
import android.widget.Button;
import android.widget.EditText;
import android.widget.TextView;
import androidx.appcompat.app.AppCompatActivity;

public class MainActivity extends AppCompatActivity {

    EditText number1, number2;
    TextView result;

    @Override
    protected void onCreate(Bundle savedInstanceState) {
        super.onCreate(savedInstanceState);
        setContentView(R.layout.activity_main);

        number1 = findViewById(R.id.number1);
        number2 = findViewById(R.id.number2);
        result = findViewById(R.id.result);

        Button add = findViewById(R.id.add);
        Button subtract = findViewById(R.id.subtract);
        Button multiply = findViewById(R.id.multiply);
        Button divide = findViewById(R.id.divide);

        add.setOnClickListener(v -> calculate("+"));
        subtract.setOnClickListener(v -> calculate("-"));
        multiply.setOnClickListener(v -> calculate("*"));
        divide.setOnClickListener(v -> calculate("/"));
    }

    private void calculate(String operation) {

        double a = Double.parseDouble(number1.getText().toString());
        double b = Double.parseDouble(number2.getText().toString());

        double answer = 0;

        switch (operation) {
            case "+":
                answer = a + b;
                break;

            case "-":
                answer = a - b;
                break;

            case "*":
                answer = a * b;
                break;

            case "/":
                if (b == 0) {
                    result.setText("0 দিয়ে ভাগ করা যাবে না");
                    return;
                }
                answer = a / b;
                break;
        }

        result.setText("Result: " + answer);
    }
}
