Name: Build JARVIS APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ১. রিপোজিটরি চেকআউট
      - name: Checkout
        uses: actions/checkout@v4

      # ২. JDK 17 সেটআপ
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ৩. Android SDK সেটআপ
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # ৪. Gradle সেটআপ (স্বয়ংক্রিয় ক্যাশিং সহ)
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # ৫. ZIP ফাইল এক্সট্র্যাক্ট করা
      - name: Extract JARVIS Project
        shell: bash
        run: |
          set -e

          rm -rf extracted
          mkdir -p extracted

          ZIP_FILE=$(find . \
            -path './.git' -prune -o \
            -type f \
            -iname '*.zip' \
            -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "::error::No ZIP file found in the repository root."
            exit 1
          fi

          echo "Found ZIP: $ZIP_FILE"
          unzip -q -o "$ZIP_FILE" -d extracted

      # ৬. অ্যান্ডকিং প্রজেক্ট খুঁজে বের করা এবং প্রস্তুত করা
      - name: Locate and Prepare Android Project
        shell: bash
        run: |
          set -e

          SETTINGS_FILE=$(find extracted -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) -print -quit)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "::error::No settings.gradle or settings.gradle.kts file found."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "Android project located at: $PROJECT_DIR"

          rm -rf android-project
          mkdir -p android-project
          
          # হিডেন ফাইল এবং ফাইল পারমিশন বজায় রেখে কপি করার জন্য cp -a ব্যবহার করা হয়েছে
          cp -a "$PROJECT_DIR"/. android-project/

      # ৭. Gradle Wrapper নিশ্চিত করা
      - name: Ensure Gradle Wrapper
        shell: bash
        run: |
          set -e
          cd android-project

          if [ ! -f "./gradlew" ] || [ ! -f "./gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "Gradle wrapper missing. Generating Wrapper..."
            gradle wrapper --gradle-version 8.7
          fi

          chmod +x ./gradlew

      # ৮. APK বিল্ড করা
      - name: Build Debug APK
        shell: bash
        run: |
          set -e
          cd android-project

          ./gradlew assembleDebug --stacktrace --no-daemon

      # ৯. তৈরি হওয়া APK খুঁজে বের করা
      - name: Stage APK Output
        shell: bash
        run: |
          set -e

          # মূল APK লোকেশনে প্রথমে খোঁজা হবে
          APK_FILE=$(find android-project/app/build/outputs/apk/debug -type f -name "*.apk" -print -quit 2>/dev/null || \
                     find android-project -type f -name "*debug*.apk" -print -quit)

          if [ -z "$APK_FILE" ]; then
            echo "::error::Build succeeded, but debug APK was not found."
            exit 1
          fi

          echo "Found APK at: $APK_FILE"
          cp "$APK_FILE" JARVIS-debug.apk

      # ১০. APK আপলোড করা (Artifact)
      - name: Upload JARVIS APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-debug-apk
          path: JARVIS-debug.apk
          if-no-files-found: error
