name: Build JARVIS APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout repository
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Find Android project
      - name: Find Android Project
        shell: bash
        run: |
          echo "Searching for Android project..."

          if [ -f "./gradlew" ]; then
            echo "Android project found in root."
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"

          elif [ -f "./Jarvis/gradlew" ]; then
            echo "Android project found in Jarvis/"
            echo "PROJECT_DIR=Jarvis" >> "$GITHUB_ENV"

          elif [ -f "./Jarvis-s/gradlew" ]; then
            echo "Android project found in Jarvis-s/"
            echo "PROJECT_DIR=Jarvis-s" >> "$GITHUB_ENV"

          else
            GRADLEW=$(find . -type f -name "gradlew" -print -quit)

            if [ -n "$GRADLEW" ]; then
              PROJECT_DIR=$(dirname "$GRADLEW")
              PROJECT_DIR="${PROJECT_DIR#./}"
              echo "Android project found at: $PROJECT_DIR"
              echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
            else
              echo "ERROR: gradlew was not found."
              echo "Repository does not contain a Gradle Android project."
              find . -maxdepth 4 -type f | sort | head -200
              exit 1
            fi
          fi

      # 3. Setup JDK 17
      # IMPORTANT: Gradle cache is intentionally disabled
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 4. Setup Android SDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # 5. Make Gradle executable
      - name: Make Gradle executable
        shell: bash
        run: |
          chmod +x "$PROJECT_DIR/gradlew"

      # 6. Build Debug APK
      - name: Build Debug APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          ./gradlew assembleDebug --no-daemon --stacktrace

      # 7. Find APK
      - name: Find APK
        shell: bash
        run: |
          echo "Searching for APK..."
          find "$PROJECT_DIR" -type f -name "*.apk" -print

      # 8. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Debug-APK
          path: |
            ${{ env.PROJECT_DIR }}/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
