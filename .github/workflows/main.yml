name: Build JARVIS APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract JARVIS Android Project
        shell: bash
        run: |
          set -e

          if [ -f "Jarvis-Android-Project.zip" ]; then
            echo "JARVIS ZIP found."
            rm -rf jarvis_project
            mkdir -p jarvis_project
            unzip -q "Jarvis-Android-Project.zip" -d jarvis_project
            echo "JARVIS project extracted."
          else
            echo "No JARVIS ZIP found."
            echo "Using repository files directly."
          fi

      - name: Find Android Project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=""

          echo "Searching for Android project..."

          if [ -f "./settings.gradle" ] || [ -f "./settings.gradle.kts" ]; then
            PROJECT_DIR="."
          else
            PROJECT_DIR=$(find . \
              -path "./.git" -prune -o \
              -type f \
                -name "settings.gradle" -o \
                -name "settings.gradle.kts" \
              -print -quit)

            if [
