name: Build JARVIS APK

on:
  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # 1. Download repository
      # =========================================================
      - name: Checkout
        uses: actions/checkout@v4

      # =========================================================
      # 2. Extract JARVIS ZIP files if present
      # =========================================================
      - name: Extract JARVIS Project
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "Checking repository for ZIP files"
          echo "======================================"

          mkdir -p "$GITHUB_WORKSPACE/_jarvis_projects"

          ZIP_COUNT=$(find "$GITHUB_WORKSPACE" \
            -type f \
            -iname "*.zip" \
            -not -path "*/.git/*" \
            -not -path "*/_jarvis_projects/*" \
            | wc -l)

          echo "ZIP files found: $ZIP_COUNT"

          if [ "$ZIP_COUNT" -gt 0 ]; then

            while IFS= read -r ZIPFILE; do

              echo "--------------------------------------"
              echo "Extracting:"
              echo "$ZIPFILE"
              echo "--------------------------------------"

              ZIPNAME=$(basename "$ZIPFILE" .zip)

              DEST="$GITHUB_WORKSPACE/_jarvis_projects/$ZIPNAME"

              mkdir -p "$DEST"

              unzip -o "$ZIPFILE" -d "$DEST"

            done < <(
              find "$GITHUB_WORKSPACE" \
                -type f \
                -iname "*.zip" \
                -not -path "*/.git/*" \
                -not -path "*/_jarvis_projects/*"
            )

          else
            echo "No ZIP files found."
          fi

          echo "Extraction completed."

      # =========================================================
      # 3. Find Android Project
      # =========================================================
      - name: Find Android Project
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "Searching for JARVIS Android project"
          echo "======================================"

          PROJECT_DIR=""

          # -----------------------------------------------------
          # First method:
          # Find app/build.gradle or app/build.gradle.kts
          # -----------------------------------------------------
          while IFS= read -r -d '' APP_GRADLE; do

            APP_DIR="$(dirname "$APP_GRADLE")"
            CANDIDATE_DIR="$(dirname "$APP_DIR")"

            echo "Checking Android project:"
            echo "$CANDIDATE_DIR"

            if [ -f "$CANDIDATE_DIR/settings.gradle" ] || \
               [ -f "$CANDIDATE_DIR/settings.gradle.kts" ]; then

              PROJECT_DIR="$CANDIDATE_DIR"
              break

            fi

          done < <(
            find "$GITHUB_WORKSPACE" \
              -type f \
              -name "build.gradle" -o -name "build.gradle.kts" \
              -path "*/app/*" \
              -not -path "*/.git/*" \
              -print0
          )

          # -----------------------------------------------------
          # Second method:
          # Find gradlew + settings.gradle
          # -----------------------------------------------------
          if [ -z "$PROJECT_DIR" ]; then

            while IFS= read -r -d '' GRADLEW; do

              DIR="$(dirname "$GRADLEW")"

              echo "Checking Gradle project:"
              echo "$DIR"

              if [ -f "$DIR/settings.gradle" ] || \
                 [ -f "$DIR/settings.gradle.kts" ]; then

                PROJECT_DIR="$DIR"
                break

              fi

            done < <(
              find "$GITHUB_WORKSPACE" \
                -type f \
                -name "gradlew" \
                -not -path "*/.git/*" \
                -print0
            )

          fi

          # -----------------------------------------------------
          # Third method:
          # Search directly for settings.gradle
          # -----------------------------------------------------
          if [ -z "$PROJECT_DIR" ]; then

            while IFS= read -r -d '' SETTINGS; do

              DIR="$(dirname "$SETTINGS")"

              if [ -d "$DIR/app" ] && \
                 { [ -f "$DIR/build.gradle" ] || \
                   [ -f "$DIR/build.gradle.kts" ]; }; then

                PROJECT_DIR="$DIR"
                break

              fi

            done < <(
              find "$GITHUB_WORKSPACE" \
                -type f \
                -name "settings.gradle" -o -name "settings.gradle.kts" \
                -not -path "*/.git/*" \
                -print0
            )

          fi

          # -----------------------------------------------------
          # If project still not found
          # -----------------------------------------------------
          if [ -z "$PROJECT_DIR" ]; then

            echo ""
            echo "======================================"
            echo "ERROR: Android project not found."
            echo "======================================"

            echo ""
            echo "Searching repository files..."

            find "$GITHUB_WORKSPACE" \
              -maxdepth 8 \
              -type f \
              -not -path "*/.git/*" \
              | sort

            exit 1

          fi

          # -----------------------------------------------------
          # Convert to absolute path
          # -----------------------------------------------------
          PROJECT_DIR="$(cd "$PROJECT_DIR" && pwd)"

          echo ""
          echo "======================================"
          echo "ANDROID PROJECT FOUND"
          echo "======================================"

          echo "PROJECT_DIR=$PROJECT_DIR"

          echo ""
          echo "Project contents:"
          ls -la "$PROJECT_DIR"

          echo ""
          echo "App contents:"
          ls -la "$PROJECT_DIR/app"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # =========================================================
      # 4. Setup Java 17
      # =========================================================
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # =========================================================
      # 5. Setup Gradle
      # =========================================================
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # =========================================================
      # 6. Prepare Gradle Wrapper
      # =========================================================
      - name: Prepare Gradle Wrapper
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "======================================"
          echo "Preparing Gradle Wrapper"
          echo "======================================"

          if [ ! -f "./gradlew" ]; then
            echo "ERROR: gradlew was not found."
            echo ""
            echo "Project directory:"
            pwd
            echo ""
            echo "Files:"
            find . -maxdepth 3 -type f | sort
            exit 1
          fi

          chmod +x ./gradlew

          echo "Gradle wrapper ready."

      # =========================================================
      # 7. Clean project
      # =========================================================
      - name: Clean Project
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "======================================"
          echo "Cleaning project"
          echo "======================================"

          ./gradlew clean --stacktrace

      # =========================================================
      # 8. Build Debug APK
      # =========================================================
      - name: Build JARVIS Debug APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "======================================"
          echo "BUILDING JARVIS APK"
          echo "======================================"

          ./gradlew assembleDebug --stacktrace

          echo ""
          echo "======================================"
          echo "APK BUILD COMPLETED"
          echo "======================================"

          find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -print

      # =========================================================
     
