name: Build JARVIS APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout repository
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Set up Java 17
      # IMPORTANT: No Gradle cache here.
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # 3. Find Android project
      - name: Find Android Project
        shell: bash
        run: |
          set -e

          echo "Searching for Android project..."

          PROJECT_DIR=""

          while IFS= read -r -d '' file; do
            DIR="$(dirname "$file")"

            if [ -f "$DIR/settings.gradle" ] || \
               [ -f "$DIR/settings.gradle.kts" ] || \
               [ -f "$DIR/build.gradle" ] || \
               [ -f "$DIR/build.gradle.kts" ]; then
              PROJECT_DIR="$DIR"
              break
            fi
          done < <(find . -type f \( \
            -name "settings.gradle" -o \
            -name "settings.gradle.kts" \
            \) -print0)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project not found."
            echo "Repository structure:"
            find . -maxdepth 4 -type f | sort
            exit 1
          fi

          PROJECT_DIR="${PROJECT_DIR#./}"

          echo "Android project found:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # 4. Show project structure
      - name: Show Project Structure
        shell: bash
        run: |
          echo "Project: $PROJECT_DIR"
          echo ""
          find "$PROJECT_DIR" -maxdepth 3 -type f | sort

      # 5. Prepare Gradle Wrapper
      - name: Prepare Gradle Wrapper
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          if [ ! -f "./gradlew" ]; then
            echo "Gradle wrapper not found."
            echo "Trying to generate wrapper..."

            gradle wrapper --gradle-version 8.7
          fi

          chmod +x ./gradlew

          echo "Gradle wrapper ready."
          ./gradlew --version

      # 6. Clean project
      - name: Clean Project
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          ./gradlew clean --no-daemon

      # 7. Build JARVIS Debug APK
      - name: Build JARVIS Debug APK
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          ./gradlew assembleDebug --no-daemon --stacktrace

      # 8. Find APK
      - name: Find APK
        shell: bash
        run: |
          set -e

          echo "Searching for APK..."

          find "$PROJECT_DIR" -type f -name "*.apk" -print

          APK="$(find "$PROJECT_DIR" -type f -name "*.apk" | head -n 1)"

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK found:"
          echo "$APK"

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      # 9. Upload APK
      - name: Upload JARVIS APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Debug-APK
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
