name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # 4. Search / extract Android project
      - name: Find Android Project
        shell: bash
        run: |
          set -e

          echo "===================================="
          echo "Searching for Android project..."
          echo "===================================="

          # Extract ZIP files if any exist
          find . -type f -iname "*.zip" -print0 | while IFS= read -r -d '' zipfile
          do
            echo "Found ZIP: $zipfile"
            mkdir -p extracted
            unzip -o "$zipfile" -d extracted || true
          done

          # Look for Gradle Android projects
          PROJECT_DIR=""

          while IFS= read -r settings; do
            dir="$(dirname "$settings")"

            if find "$dir" -maxdepth 2 \
              -type f \
              -name "build.gradle" -o -name "build.gradle.kts" \
              | grep -q .; then

              PROJECT_DIR="$dir"
              break
            fi
          done < <(
            find . \
              -type f \
              -name "settings.gradle" -o -name "settings.gradle.kts" \
              -not -path "./.git/*"
          )

          if [ -n "$PROJECT_DIR" ]; then
            echo "Android project found:"
            echo "$PROJECT_DIR"
            echo "$PROJECT_DIR" > android_project_dir.txt
          else
            echo "No Android project found."
            echo "A clean Android project will be created."
            echo "CREATE_NEW_PROJECT=true" > android_project_dir.txt
          fi

      # 5. Create fallback Android project if necessary
      - name: Create Android Project If Missing
        shell: bash
        run: |
          set -e

          if grep -q "CREATE_NEW_PROJECT=true" android_project_dir.txt; then

            echo "Creating JARVIS Android project..."

            mkdir -p jarvis-app/app/src/main/java/com/jarvis/ai
            mkdir -p jarvis-app/app/src/main/res/values

            cat > jarvis-app/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "JARVIS"
          include(":app")
          EOF

            cat > jarvis-app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

            cat > jarvis-app/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.jarvis.ai'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.jarvis.ai'
                  minSdk 24
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }
          }
          EOF

            cat > jarvis-app/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:allowBackup="false"
                  android:label="JARVIS"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LA
