name: Build JARVIS APK

on:
  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout repository
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Setup JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Setup Android SDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # 4. Install unzip
      - name: Install unzip
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip

      # 5. Setup Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # 6. Extract JARVIS ZIP
      - name: Extract JARVIS Project
        shell: bash
        run: |
          set -e

          rm -rf extracted
          mkdir -p extracted

          ZIP_FILE=$(find . \
            -path './.git' -prune -o \
            -type f \
            -iname '*.zip' \
            -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found."
            exit 1
          fi

          echo "Found ZIP:"
          echo "$ZIP_FILE"

          unzip -o "$ZIP_FILE" -d extracted

          echo ""
          echo "ZIP extracted successfully."

          echo ""
          echo "===== EXTRACTED FILES ====="
          find extracted -maxdepth 5 -type f | sort | head -300

      # 7. Find Android Project
      - name: Find Android Project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=""

          while IFS= read -r SETTINGS_FILE; do

            DIR=$(dirname "$SETTINGS_FILE")

            if [ -f "$DIR/settings.gradle" ] || \
               [ -f "$DIR/settings.gradle.kts" ]; then

              PROJECT_DIR="$DIR"
              break

            fi

          done < <(
            find extracted \
              -type f \
              \
                -name "settings.gradle" \
                -o \
                -name "settings.gradle.kts" \
              \
              -print
          )

          if [ -z "$PROJECT_DIR" ]; then

            echo "ERROR: Android project was not found."

            echo ""
            echo "Searching for Gradle files:"

            find extracted \
              -type f \
              \
                -name "build.gradle" \
                -o \
                -name "build.gradle.kts" \
                -o \
                -name "settings.gradle" \
                -o \
                -name "settings.gradle.kts" \
              \
              -print

            exit 1
          fi

          echo "Android project found:"
          echo "$PROJECT_DIR"

          echo "$PROJECT_DIR" > project_path.txt

      # 8. Prepare Android Project
      - name: Prepare Android Project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=$(cat project_path.txt)

          echo "Preparing project from:"
          echo "$PROJECT_DIR"

          rm -rf android-project
          mkdir -p android-project

          cp -R "$PROJECT_DIR"/. android-project/

          echo ""
          echo "===== ANDROID PROJECT ====="

          find android-project \
            -maxdepth 4 \
            -type f \
            | sort \
            | head -300

      # 9. Create Gradle Wrapper if missing
      - name: Create Gradle Wrapper
        shell: bash
        run: |
          set -e

          cd android-project

          echo "Checking Gradle Wrapper..."

          if [ -f "./gradlew" ] && \
             [ -f "./gradle/wrapper/gradle-wrapper.jar" ] && \
             [ -f "./gradle/wrapper/gradle-wrapper.properties" ]; then

            echo "Gradle Wrapper already exists."

          else

            echo "Gradle Wrapper is missing."
            echo "Creating a new Gradle Wrapper..."

            cd ..

            rm -rf wrapper-generator
            mkdir -p wrapper-generator

            cd wrapper-generator

            cat > settings.gradle <<'EOF'
pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = "WrapperGenerator"
EOF

            cat > build.gradle <<'EOF'
plugins {
}
EOF

            gradle wrapper --gradle-version 8.7

            cd ..

            cp wrapper-generator/gradlew android-project
