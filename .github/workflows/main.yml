name: Build JARVIS APK

on:
  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # 1. Download repository
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Extract JARVIS ZIP files if present
      - name: Extract JARVIS Project
        shell: bash
        run: |
          set -e

          echo "Checking repository..."

          mkdir -p "$GITHUB_WORKSPACE/_jarvis_projects"

          ZIP_COUNT=$(find "$GITHUB_WORKSPACE" \
            -type f \
            -name "*.zip" \
            -not -path "*/.git/*" \
            -not -path "*/_jarvis_projects/*" \
            | wc -l)

          echo "ZIP files found: $ZIP_COUNT"

          if [ "$ZIP_COUNT" -gt 0 ]; then
            while IFS= read -r ZIPFILE; do
              echo "Extracting: $ZIPFILE"

              ZIPNAME=$(basename "$ZIPFILE" .zip)
              DEST="$GITHUB_WORKSPACE/_jarvis_projects/$ZIPNAME"

              mkdir -p "$DEST"
              unzip -o "$ZIPFILE" -d "$DEST"

            done < <(
              find "$GITHUB_WORKSPACE" \
                -type f \
                -name "*.zip" \
                -not -path "*/.git/*" \
                -not -path "*/_jarvis_projects/*"
            )
          fi

          echo "Extraction completed."

      # 3. Find Android/Gradle project
      - name: Find Android Project
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "Searching for JARVIS Android project"
          echo "======================================"

          PROJECT_DIR
