name: Build JARVIS APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:

      # 1. Checkout repository
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Setup JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Install unzip
      - name: Install unzip
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip

      # 4. Extract JARVIS ZIP
      - name: Extract JARVIS Project
        shell: bash
        run: |
          set -e

          mkdir -p extracted

          ZIP_FILE=$(find . \
            -path './.git' -prune -o \
            -type f \
            \( -iname '*.zip' \) \
            -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "No ZIP file found."
            exit 1
          fi

          echo "Found ZIP: $ZIP_FILE"

          unzip -o "$ZIP_FILE" -d extracted

          echo "ZIP extracted successfully."

          echo "Extracted files:"
          find extracted -maxdepth 4 -type f | head -200

      # 5. Find Android Project
      - name: Find Android Project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=""

          while IFS= read -r SETTINGS_FILE; do

            DIR=$(dirname "$SETTINGS_FILE")

            if [ -f "$DIR/settings.gradle" ] || \
               [ -f "$DIR/settings.gradle.kts" ]; then

              PROJECT_DIR="$DIR"
              break

            fi

          done < <(
            find extracted \
              -type f \
              \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
              -print
          )

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project was not found."
            echo ""
            echo "Searching for Gradle files:"
            find extracted \
              -type f \
              \( -name "build.gradle" -o -name "build.gradle.kts" \) \
              -print
            exit 1
          fi

          echo "Android project found:"
          echo "$PROJECT_DIR"

          echo "$PROJECT_DIR" > project_path.txt

      # 6. Move project to workspace
      - name: Prepare Android Project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=$(cat project_path.txt)

          echo "Preparing project from:"
          echo "$PROJECT_DIR"

          mkdir -p android-project

          cp -R "$PROJECT_DIR"/. android-project/

          echo ""
          echo "Android project structure:"
          find android-project -maxdepth 3 -type f | sort | head -200

      # 7. Check Gradle Wrapper
      - name: Check Gradle Wrapper
        shell: bash
        working-directory: android-project
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            echo "Gradle wrapper found."
          else
            echo "ERROR: gradlew not found."
            echo "The Android project must contain Gradle Wrapper files."
            find . -maxdepth 3 -type f | sort
            exit 1
          fi

      # 8. Show Android Project Structure
      - name: Show Project Structure
        shell: bash
        working-directory: android-project
        run: |
          echo "===== PROJECT ROOT ====="
          ls -la

          echo ""
          echo "===== GRADLE FILES ====="
          find . \
            -maxdepth 4 \
            -type f \
            \( -name "settings.gradle" \
            -o -name "settings.gradle.kts" \
            -o -name "build.gradle" \
            -o -name "build.gradle.kts" \
            -o -name "gradle.properties" \) \
            -print

      # 9. Clean Project
      - name: Clean Project
        shell: bash
        working-directory: android-project
        run: |
          chmod +x ./gradlew
          ./gradlew clean --stacktrace

      # 10. Build JARVIS Debug APK
      - name: Build JARVIS Debug APK
        shell: bash
        working-directory: android-project
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace --info

      # 11. Find APK
      - name: Find APK
        shell: bash
        run: |
          set -e

          echo "Searching for APK..."

          find android-project \
            -type f \
            -name "*.apk" \
            -print

      # 12. Upload APK
      - name: Upload JARVIS APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-APK
          path: |
            android-project/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
