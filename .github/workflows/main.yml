name: Build JARVIS APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Find Android Project
        shell: bash
        run: |
          set -e

          echo "Searching for Android project..."

          PROJECT_DIR=""

          while IFS= read -r settings_file; do
            DIR="$(dirname "$settings_file")"

            if [ -f "$DIR/build.gradle" ] || [ -f "$DIR/build.gradle.kts" ]; then
              PROJECT_DIR="$DIR"
              break
            fi
          done < <(find . -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \))

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project not found."
            echo "Searching repository contents:"
            find . -maxdepth 5 -type f | head -300
            exit 1
          fi

          echo "Android project found:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Show Project Structure
        shell: bash
        run: |
          echo "Project: $PROJECT_DIR"
          echo ""
          find "$PROJECT_DIR" -maxdepth 3 -type f | sort | head -300

      - name: Prepare Gradle Wrapper
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            echo "Gradle wrapper found."
          else
            echo "Gradle wrapper not found."
            echo "Installing Gradle..."
            sudo apt-get update
            sudo apt-get install -y gradle

            gradle wrapper --gradle-version 8.7

            chmod +x ./gradlew
          fi

      - name: Clean Project
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"
          ./gradlew clean --no-daemon

      - name: Build JARVIS Debug APK
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Find APK
        shell: bash
        run: |
          set -e

          echo "Searching for APK..."

          find "$PROJECT_DIR" -type f -name "*.apk" -print

          APK="$(find "$PROJECT_DIR" -type f -name "*.apk" | head -1)"

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not created."
            exit 1
          fi

          echo "APK found:"
          echo "$APK"

          mkdir -p "$GITHUB_WORKSPACE/apk-output"
          cp "$APK" "$GITHUB_WORKSPACE/apk-output/JARVIS-debug.apk"

      - name: Upload JARVIS APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-debug-APK
          path: apk-output/JARVIS-debug.apk
          if-no-files-found: error
