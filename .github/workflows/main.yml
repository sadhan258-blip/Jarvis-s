name: Build JARVIS APK

on:
  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # 1. Download repository
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Extract JARVIS ZIP files if present
      - name: Extract JARVIS Project
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "Checking repository for ZIP files"
          echo "======================================"

          mkdir -p "$GITHUB_WORKSPACE/_jarvis_projects"

          ZIP_COUNT=$(find "$GITHUB_WORKSPACE" \
            -type f \
            -name "*.zip" \
            -not -path "*/.git/*" \
            -not -path "*/_jarvis_projects/*" \
            | wc -l)

          echo "ZIP files found: $ZIP_COUNT"

          if [ "$ZIP_COUNT" -gt 0 ]; then

            while IFS= read -r ZIPFILE; do

              echo "--------------------------------------"
              echo "Extracting:"
              echo "$ZIPFILE"
              echo "--------------------------------------"

              ZIPNAME=$(basename "$ZIPFILE" .zip)

              DEST="$GITHUB_WORKSPACE/_jarvis_projects/$ZIPNAME"

              mkdir -p "$DEST"

              unzip -o "$ZIPFILE" -d "$DEST"

            done < <(
              find "$GITHUB_WORKSPACE" \
                -type f \
                -name "*.zip" \
                -not -path "*/.git/*" \
                -not -path "*/_jarvis_projects/*"
            )

          else
            echo "No ZIP files found."
          fi

          echo "Extraction completed."

      # 3. Find Android/Gradle project
      - name: Find Android Project
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "Searching for JARVIS Android project"
          echo "======================================"

          PROJECT_DIR=""

          while IFS= read -r -d '' GRADLEW; do

            DIR="$(dirname "$GRADLEW")"

            echo "Checking:"
            echo "$DIR"

            if [ -f "$DIR/settings.gradle" ] || \
               [ -f "$DIR/settings.gradle.kts" ]; then

              PROJECT_DIR="$DIR"
              break

            fi

          done < <(
            find "$GITHUB_WORKSPACE" \
              -type f \
              -name "gradlew" \
              -not -path "*/.git/*" \
              -print0
          )

          # Fallback: look for build.gradle/settings.gradle
          if [ -z "$PROJECT_DIR" ]; then

            while IFS= read -r -d '' SETTINGS; do

              DIR="$(dirname "$SETTINGS")"

              if [ -f "$DIR/build.gradle" ] || \
                 [ -f "$DIR/build.gradle.kts" ]; then

                PROJECT_DIR="$DIR"
                break

              fi

            done < <(
              find "$GITHUB_WORKSPACE" \
                -type f \
                -name "settings.gradle" -o -name "settings.gradle.kts" \
                -not -path "*/.git/*" \
                -print0
            )

          fi

          if [ -z "$PROJECT_DIR" ]; then

            echo ""
            echo "======================================"
            echo "ERROR: Android project not found."
            echo "======================================"

            echo ""
            echo "Repository files:"
            find "$GITHUB_WORKSPACE" \
              -maxdepth 6 \
              -type f \
              -not -path "*/.git/*" \
              | sort

            exit 1
          fi

          PROJECT_DIR="$(cd "$PROJECT_DIR" && pwd)"

          echo ""
          echo "======================================"
          echo "Android project FOUND"
          echo "======================================"

          echo "PROJECT_DIR=$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$
