name: Build JARVIS APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Extract JARVIS Android Project
        shell: bash
        run: |
          set -e

          if [ -f "Jarvis-Android-Project.zip" ]; then
            echo "ZIP found. Extracting..."
            rm -rf jarvis_project
            mkdir -p jarvis_project
            unzip -q "Jarvis-Android-Project.zip" -d jarvis_project
          else
            echo "No ZIP found. Using repository directly."
          fi

      - name: Find Android Project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=""

          for dir in "." "./jarvis_project" "./jarvis_project/Jarvis-Android-Project"; do
            if [ -f "$dir/settings.gradle" ] || [ -f "$dir/settings.gradle.kts" ]; then
              PROJECT_DIR="$dir"
              break
            fi
          done

          if [ -z "$PROJECT_DIR" ]; then
            PROJECT_DIR=$(find . \
              -path "./.git" -prune -o \
              -path "./jarvis_project/.git" -prune -o \
              -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
              -print -quit | xargs -r dirname)
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project was not found."
            exit 1
          fi

          PROJECT_DIR="${PROJECT_DIR#./}"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Make Gradle executable
        shell: bash
        run: |
          if [ -f "$PROJECT_DIR/gradlew" ]; then
            chmod +x "$PROJECT_DIR/gradlew"
          else
            echo "ERROR: gradlew not found in $PROJECT_DIR"
            exit 1
          fi

      - name: Build Debug APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          ./gradlew assembleDebug --stacktrace

      - name: Find and Stage APK
        shell: bash
        run: |
          APK_PATH=$(find "$PROJECT_DIR" -type f -name "*.apk" -print -quit)

          if [ -z "$APK_PATH" ]; then
            echo "ERROR: APK was not created."
            exit 1
          fi

          cp "$APK_PATH" "$GITHUB_WORKSPACE/JARVIS-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-APK
          path: JARVIS-debug.apk
          if-no-files-found: error
